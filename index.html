
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Stick Stretch Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
      }
      
      body {
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background-color: #020617;
        font-family: 'Courier New', Courier, monospace;
      }
      
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }
      
      /* Deep Quantum Void Background with slight atmosphere */
      .sky-background {
        background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      }

      /* Custom Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: float 2.5s ease-in-out infinite;
      }

      @keyframes grid-scroll {
        0% { background-position: 0 0; }
        100% { background-position: 0 60px; }
      }
      .animate-grid-scroll {
        animation: grid-scroll 1.5s linear infinite;
      }
      
      /* Floor Grid */
      .cyber-grid {
        position: absolute;
        width: 200%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
        background-size: 80px 80px;
        transform: perspective(300px) rotateX(60deg);
        transform-origin: center top;
        opacity: 0.3;
        bottom: -30%; 
        left: -50%;
        pointer-events: none;
        mask-image: linear-gradient(to bottom, transparent 0%, black 20%, transparent 90%);
      }

      /* Ceiling Grid - Mirrored for Tunnel Effect */
      .cyber-ceiling {
        position: absolute;
        width: 200%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(139, 92, 246, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
        background-size: 120px 120px;
        transform: perspective(400px) rotateX(-60deg);
        transform-origin: center bottom;
        opacity: 0.2;
        top: -45%; 
        left: -50%;
        pointer-events: none;
        mask-image: linear-gradient(to top, transparent 0%, black 20%, transparent 90%);
      }

      /* Vertical Depth Lines / Background Pillars */
      .bg-pillar {
        position: absolute;
        bottom: 0;
        background: linear-gradient(to top, rgba(30, 41, 59, 0.4) 0%, rgba(30, 41, 59, 0.1) 50%, transparent 100%);
        border-left: 1px solid rgba(255, 255, 255, 0.03);
        border-right: 1px solid rgba(0, 0, 0, 0.2);
        pointer-events: none;
        z-index: 0;
      }

      /* Vertical Depth Markers for Parallax */
      .vertical-depth-marker {
        position: absolute;
        top: -50%;
        bottom: -50%;
        width: 1px;
        background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.08) 50%, transparent 100%);
        pointer-events: none;
        z-index: 0;
      }

      /* Tech Texture for Platforms */
      .platform-texture {
        background-image: 
          radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.05) 50%,
          rgba(0,0,0,0.05)
        );
        background-size: 100% 3px; 
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.1;
      }

      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -1px) rotate(-0.5deg); }
        20% { transform: translate(-2px, 0px) rotate(0.5deg); }
        30% { transform: translate(2px, 1px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(0.5deg); }
        50% { transform: translate(-1px, 1px) rotate(-0.5deg); }
        60% { transform: translate(-2px, 1px) rotate(0deg); }
        70% { transform: translate(2px, 1px) rotate(-0.5deg); }
        80% { transform: translate(-1px, -1px) rotate(0.5deg); }
        90% { transform: translate(1px, 1px) rotate(0deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
      }

      .shake-effect {
        animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both;
      }

      .glow-text {
        text-shadow: 0 0 10px currentColor;
      }
      
      .text-outline {
        -webkit-text-stroke: 1.5px currentColor;
        color: transparent;
      }

      /* New Surreal Flux Lines */
      .cyber-flux {
        position: absolute;
        background: linear-gradient(to top, transparent, currentColor, transparent);
        width: 2px;
        border-radius: 999px;
        opacity: 0.3;
        mix-blend-mode: screen;
        pointer-events: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="sky-background text-white overflow-hidden font-mono selection:bg-pink-500 selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
